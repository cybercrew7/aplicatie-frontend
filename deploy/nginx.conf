# -----------------------------------------------------------------------------
# Nginx — configurație de producție pentru aplicatie-frontend
#
# - Servește build-ul static generat de `npm run build` (directorul build/).
# - Rutele client-side (/resources, /reservations, /admin) cad pe index.html,
#   astfel încât un refresh pe orice pagină funcționează (mod SPA).
# - Cererile /api/ sunt trimise prin reverse proxy către backend-ul
#   ASP.NET Core (Kestrel) care ascultă pe http://localhost:5000.
#
# Instalare (exemplu Debian/Ubuntu):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aplicatie-frontend
#   sudo ln -s /etc/nginx/sites-available/aplicatie-frontend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # înlocuiți cu domeniul real

    # Directorul în care se copiază conținutul din build/
    root /var/www/aplicatie-frontend;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    # --- Compresie -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Antete de securitate -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API: reverse proxy către ASP.NET Core --------------------------------
    # /api/resources  ->  http://localhost:5000/api/resources
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Antetul Authorization (Bearer JWT) este transmis implicit.

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # --- Resurse statice cu hash (imuabile) -----------------------------------
    # Fișierele din _app/immutable/ au hash în nume, deci pot fi cache-uite agresiv.
    location /_app/immutable/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Aplicația SPA --------------------------------------------------------
    # Orice rută necunoscută ca fișier este servită de index.html,
    # iar routerul SvelteKit preia navigarea în browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nu trebuie cache-uit, altfel utilizatorii pot rămâne
    # pe o versiune veche după un deploy nou.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
